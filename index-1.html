<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رواق | ملخصات الكتب</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#f8fafc;font-family:Tahoma,Arial;line-height:1.85}header{background:#1d2b40;text-align:center;padding:28px 14px}h1,h2{color:#e9bd73}header p,.note{color:#cbd5e1}main{max-width:750px;margin:auto;padding:18px}input,select{width:100%;padding:14px;border:0;border-radius:12px;font-size:17px;margin:7px 0}.book{background:#202e43;border-radius:16px;padding:19px;margin:16px 0}.book h2{font-size:22px;margin:0}.book p{margin:8px 0}.summary{background:#172337;padding:14px;border-radius:12px}button{background:#e9bd73;color:#101827;border:0;border-radius:10px;padding:12px;margin:5px 2px;font-size:16px;cursor:pointer}.secondary{background:#dbe4ee}#status{color:#f2c879}footer{text-align:center;padding:22px;color:#94a3b8}</style></head><body><header><h1>📚 رواق</h1><p>ملخصات عربية مسموعة ومقروءة</p></header><main><p class="note">10 ملخصات تعريفية مكتوبة خصيصًا لرواق، وليست النصوص الكاملة للكتب.</p><input id="search" placeholder="🔎 ابحث عن كتاب أو مؤلف" aria-label="بحث"><label for="voice">اختيار الصوت العربي المتاح على الهاتف</label><select id="voice"><option value="">الصوت الافتراضي</option></select><p id="status" aria-live="polite"></p><div id="library"></div></main><footer>رواق — اقرأ واستمع</footer><script>
const books=[
['مقدمة ابن خلدون','ابن خلدون','تاريخ وفكر','يفسّر ابن خلدون كيف تنشأ الدول وتكبر ثم تضعف. ويرى أن التضامن بين الناس يساعد على قيام السلطة، لكن الترف والظلم قد يضعفانها بمرور الزمن. كما يؤكد أهمية العمل والعمران والاقتصاد في حياة المجتمعات.'],
['الأيام','طه حسين','سيرة وأدب','يروي طه حسين جانبًا من طفولته وتعلّمه، ويصف كيف واجه فقدان البصر وصعوبات الدراسة. تتناول السيرة أثر الأسرة والقرية والتعليم في تكوين شخصيته، وتبرز قيمة الفضول والمثابرة.'],
['حي بن يقظان','ابن طفيل','فلسفة','تدور الحكاية حول إنسان ينشأ بعيدًا عن المجتمع، ويبدأ في فهم الطبيعة بالملاحظة والتجربة والتفكير. ينتقل من أسئلة الحياة اليومية إلى أسئلة الوجود والمعرفة، ويناقش العمل العلاقة بين العقل والتأمل والإيمان.'],
['كليلة ودمنة','ابن المقفع','حكم وحكايات','يستخدم الكتاب حكايات الحيوانات للحديث عن السلطة والصداقة والخداع والحكمة. في كثير من القصص تتسبب الكلمة المتسرعة أو النصيحة السيئة في عواقب كبيرة، فتدعو الحكايات إلى التأمل قبل اتخاذ القرار.'],
['ألف ليلة وليلة','من التراث العربي','حكايات','تروي شهرزاد حكايات متتابعة لتؤجل مصيرها، فتفتح أبوابًا لعوالم التجار والملوك والرحلات والمفاجآت. تتنوع القصص بين المغامرة والعبرة والخيال، وتربطها براعة الحكي والتشويق.'],
['الأمير','نيكولو مكيافيلي','سياسة','يتناول الكتاب طرق اكتساب السلطة والحفاظ عليها، ويبحث في أثر القوة والحظ والقرارات الصعبة. يميز بين الصورة التي يظهر بها الحاكم وبين أفعاله عند الأزمات. يمكن قراءة الكتاب بوصفه تحليلًا واقعيًا للسياسة.'],
['تأملات','ماركوس أوريليوس','فلسفة','يسجل الإمبراطور الروماني تأملات حول ضبط النفس وقبول ما لا نستطيع تغييره. يدعو إلى العدل والعمل المتقن وعدم الانسياق وراء الغضب أو الشهرة، ويركز على مسؤوليتنا عن أفعالنا وأحكامنا.'],
['رسالة الغفران','أبو العلاء المعري','أدب','عمل أدبي تخييلي يستخدم رحلة في العالم الآخر لطرح أسئلة عن الشعر واللغة والأحكام البشرية. يمزج السخرية بالنقد الثقافي، ويعرض لقاءات مع شعراء وشخصيات أدبية.'],
['البخلاء','الجاحظ','أدب وفكاهة','يجمع الجاحظ حكايات ومواقف ساخرة عن البخل وأساليب تبريره. تكشف القصص طبائع الناس وعاداتهم ولغتهم في الحياة اليومية، ووراء الطرافة ملاحظة دقيقة للمجتمع والنفس البشرية.'],
['طوق الحمامة','ابن حزم','أدب ونفس','يتناول ابن حزم الحب وعلاماته وأسبابه وأحوال المحبين، مستعينًا بالملاحظة والحكاية والتأمل. يصف المشاعر بدقة إنسانية، ويجمع بين الأدب والتحليل النفسي والاجتماعي.']
];
const lib=document.getElementById('library'),search=document.getElementById('search'),voiceSelect=document.getElementById('voice'),status=document.getElementById('status');let voices=[];
function loadVoices(){if(!('speechSynthesis' in window)){status.textContent='الصوت غير مدعوم في هذا المتصفح';return;}voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ar'));const chosen=voiceSelect.value;voiceSelect.innerHTML='<option value="">الصوت العربي الافتراضي</option>';voices.forEach((v,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=v.name+' — '+v.lang;voiceSelect.appendChild(o)});if([...voiceSelect.options].some(o=>o.value===chosen))voiceSelect.value=chosen;}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speak(text){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ar';u.rate=.85;const n=voiceSelect.value;if(n!==''&&voices[Number(n)])u.voice=voices[Number(n)];u.onstart=()=>status.textContent='🔊 جارٍ تشغيل الملخص';u.onend=()=>status.textContent='انتهت القراءة';u.onerror=()=>status.textContent='تعذّر تشغيل الصوت، جرّب صوتًا آخر';speechSynthesis.speak(u);}
function render(){lib.replaceChildren();const q=search.value.trim().toLowerCase();const found=books.filter(b=>b.join(' ').toLowerCase().includes(q));if(!found.length){lib.textContent='لا توجد نتائج';return;}found.forEach(b=>{const card=document.createElement('article');card.className='book';const h=document.createElement('h2');h.textContent=b[0];const meta=document.createElement('p');meta.textContent='✍️ '+b[1]+' · '+b[2];const summary=document.createElement('p');summary.className='summary';summary.textContent=b[3];const play=document.createElement('button');play.textContent='▶ استمع للملخص';play.onclick=()=>speak(b[0]+'. '+b[3]);const stop=document.createElement('button');stop.className='secondary';stop.textContent='■ إيقاف';stop.onclick=()=>{speechSynthesis.cancel();status.textContent='توقّف الصوت'};card.append(h,meta,summary,play,stop);lib.append(card);});}search.addEventListener('input',render);render();
</script></body></html>

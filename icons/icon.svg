<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16243d"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d485"/>
      <stop offset="50%" stop-color="#e5b869"/>
      <stop offset="100%" stop-color="#c6953f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- خلفية مربعة مستديرة الزوايا مخصصة لأيقونة التطبيق -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- قوس الرواق المعماري الإسلامي التونسي -->
  <path d="M 120 400 L 120 250 C 120 150, 256 100, 256 100 C 256 100, 392 150, 392 250 L 392 400" 
        fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- كتاب مفتوح في قلب الرواق -->
  <g transform="translate(136, 230)" filter="url(#shadow)">
    <!-- الجناح الأيمن للكتاب -->
    <path d="M 120 40 C 70 30, 20 45, 0 55 L 0 135 C 20 125, 70 110, 120 120 Z" 
          fill="url(#goldGrad)" opacity="0.95"/>
    <!-- الجناح الأيسر للكتاب -->
    <path d="M 120 40 C 170 30, 220 45, 240 55 L 240 135 C 220 125, 170 110, 120 120 Z" 
          fill="url(#goldGrad)" opacity="0.95"/>
    <!-- الخط الأوسط (العمود الفقري) -->
    <line x1="120" y1="36" x2="120" y2="124" stroke="#0b1120" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- ذبذبات صوتية مسموعة فوق الكتاب -->
  <g fill="url(#goldGrad)">
    <circle cx="216" cy="210" r="7"/>
    <circle cx="256" cy="195" r="9"/>
    <circle cx="296" cy="210" r="7"/>
  </g>

  <!-- نص رواق الكوفي الأنيق بالأسفل -->
  <text x="256" y="435" text-anchor="middle" fill="url(#goldGrad)" font-size="44" font-family="'Cairo', 'Tahoma', 'Arial', sans-serif" font-weight="bold" letter-spacing="2">رواق</text>
</svg>
